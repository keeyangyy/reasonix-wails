name: Bug 报告
description: 报告 Reasonix Wails 的问题
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请尽量提供可复现的信息；不要粘贴密钥、token 或其他隐私数据。
  - type: input
    id: wails-version
    attributes:
      label: Reasonix Wails 版本
      description: 应用内「关于 / 设置」里的版本，或 `reasonix --version` 的输出
      placeholder: 例如 v0.1.0
    validations:
      required: true
  - type: dropdown
    id: install-type
    attributes:
      label: 安装方式
      options:
        - 安装版（installer）
        - 便携版（单 exe）
        - 从源码构建
        - 不确定
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 版本 / 架构
      placeholder: 例如 Windows 11 24H2 x64
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么
      description: 实际现象，以及你期望的行为
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: 相关错误输出或截图；请先去除个人信息和密钥
      render: shell
    validations:
      required: false