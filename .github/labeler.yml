# Area labels auto-applied to PRs by .github/workflows/pr-auto-label.yml
# (actions/labeler), based on the changed file paths.
#
# severity/platform are issue-only — a PR is a change, not a bug report.

agent:
  - changed-files:
      - any-glob-to-any-file:
          - 'internal/agent/**'
          - 'internal/control/**'

mcp:
  - changed-files:
      - any-glob-to-any-file:
          - 'internal/plugin/**'

config:
  - changed-files:
      - any-glob-to-any-file:
          - 'internal/config/**'
          - 'internal/boot/**'

provider:
  - changed-files:
      - any-glob-to-any-file:
          - 'internal/provider/**'

skills:
  - changed-files:
      - any-glob-to-any-file:
          - 'internal/skill/**'
          - 'internal/tool/**'

tui:
  - changed-files:
      - any-glob-to-any-file:
          - 'internal/cli/**'

desktop:
  - changed-files:
      - any-glob-to-any-file:
          - 'desktop/**'

updater:
  - changed-files:
      - any-glob-to-any-file:
          - 'desktop/cmd/sign/**'
          - 'desktop/updater*.go'
          - 'scripts/desktop-build.sh'
          - '.github/workflows/release*.yml'

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - 'docs/**'
          - 'plan/**'
          - 'release-notes/**'
          - '**/*.md'

github_actions:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/workflows/**'
          - '.github/**'
          - '.agents/**'
          - 'scripts/ci-*'
          - 'scripts/*.test.mjs'

go:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.go'
          - 'go.mod'
          - 'go.sum'
          - 'sdk/go/**'

javascript:
  - changed-files:
      - any-glob-to-any-file:
          - 'desktop/frontend/**'
          - 'site/**'
          - '**/*.mjs'
          - '**/*.ts'
          - '**/*.tsx'

