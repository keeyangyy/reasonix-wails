name: Check codeql

on:
  workflow_call:
    inputs:
      code: { required: true, type: string }
      desktop: { required: true, type: string }
      workflow: { required: true, type: string }

permissions:
  contents: read
  security-events: write
  packages: read
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Each language declares whether this diff can change it, so a
        # workflow-only PR no longer re-analyses Go and TypeScript (3.8 minutes
        # of pure waste on a change that touched no code).
        include:
          - language: go
            build-mode: autobuild
            needed: ${{ inputs.code == 'true' }}
          - language: javascript-typescript
            build-mode: none
            needed: ${{ inputs.code == 'true' || inputs.desktop == 'true' }}
          - language: actions
            build-mode: none
            needed: ${{ inputs.workflow == 'true' || inputs.code == 'true' }}
    steps:
      - if: matrix.needed
        uses: actions/checkout@v7
      - name: Initialize CodeQL
        if: matrix.needed
        uses: github/codeql-action/init@v4.37.4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Perform CodeQL Analysis
        if: matrix.needed
        uses: github/codeql-action/analyze@v4.37.4
        with:
          category: "/language:${{ matrix.language }}"
