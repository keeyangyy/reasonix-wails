name: CI

# Single PR entry: classify the diff once and schedule only affected lanes.
# On main pushes (or manual invocation), all code lanes are exhaustive.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  # check-codeql needs these; a reusable workflow cannot exceed the caller's
  # permissions, so they have to be granted here as well.
  security-events: write
  packages: read
  actions: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    uses: ./.github/workflows/check-changes.yml

  docs-rules:
    uses: ./.github/workflows/check-docs-rules.yml

  # PR metadata checks use trusted scripts from the base commit and are part of Gate.
  docs-impact:
    needs: changes
    if: ${{ github.event_name == 'pull_request' && needs.changes.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Collect PR changed files
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh api --paginate "repos/${REPOSITORY}/pulls/${PR_NUMBER}/files" \
            --jq '.[].filename' > "$RUNNER_TEMP/docs-impact-files.txt"

      - name: Check documentation impact declaration
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          DOCS_IMPACT_CHANGED_FILES_FILE: ${{ runner.temp }}/docs-impact-files.txt
        run: bash scripts/check-docs-impact.sh

  cache-impact:
    needs: changes
    if: ${{ github.event_name == 'pull_request' && needs.changes.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Collect PR changed files
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh api --paginate "repos/${REPOSITORY}/pulls/${PR_NUMBER}/files" \
            --jq '.[].filename' > "$RUNNER_TEMP/cache-impact-files.txt"

      - name: Check cache-sensitive PR metadata
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          CACHE_IMPACT_CHANGED_FILES_FILE: ${{ runner.temp }}/cache-impact-files.txt
        run: bash scripts/check-cache-impact.sh

  lint:
    needs: changes
    if: ${{ needs.changes.result == 'success' && (needs.changes.outputs.code == 'true' || needs.changes.outputs.desktop == 'true' || needs.changes.outputs.workflow == 'true') }}
    uses: ./.github/workflows/check-lint.yml
    with:
      code: ${{ needs.changes.outputs.code }}
      desktop: ${{ needs.changes.outputs.desktop }}
      workflow: ${{ needs.changes.outputs.workflow }}

  go:
    needs: changes
    if: ${{ needs.changes.result == 'success' && (needs.changes.outputs.code == 'true' || needs.changes.outputs.sdk == 'true') }}
    uses: ./.github/workflows/check-go.yml
    with:
      code: ${{ needs.changes.outputs.code }}
      sdk: ${{ needs.changes.outputs.sdk }}

  desktop:
    needs: changes
    if: ${{ needs.changes.result == 'success' && needs.changes.outputs.desktop == 'true' }}
    uses: ./.github/workflows/check-desktop.yml
    with:
      desktop: ${{ needs.changes.outputs.desktop }}
      desktop_direct: ${{ needs.changes.outputs.desktop_direct }}
      full: ${{ needs.changes.outputs.full }}
      changes_ok: ${{ needs.changes.result }}

  codeql:
    needs: changes
    if: ${{ needs.changes.result == 'success' && (needs.changes.outputs.code == 'true' || needs.changes.outputs.desktop == 'true' || needs.changes.outputs.workflow == 'true') }}
    uses: ./.github/workflows/check-codeql.yml
    with:
      code: ${{ needs.changes.outputs.code }}
      desktop: ${{ needs.changes.outputs.desktop }}
      workflow: ${{ needs.changes.outputs.workflow }}

  # Memory belongs to every exhaustive verification: main push, manual full
  # runs, scheduled full runs (ci-full.yml), and release/* PRs. Release does
  # not repeat it; release.yml waits for this main-push CI to pass.
  memory:
    needs: changes
    if: ${{ needs.changes.result == 'success' && (github.event_name != 'pull_request' || needs.changes.outputs.full == 'true') }}
    uses: ./.github/workflows/check-memory.yml

  gate:
    needs: [changes, docs-rules, docs-impact, cache-impact, lint, go, desktop, codeql, memory]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify every selected check passed
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          results = json.loads(os.environ["RESULTS"])
          event = os.environ["EVENT_NAME"]
          outputs = results["changes"].get("outputs", {})
          failures = []

          def expect(name, expected):
              actual = results[name]["result"]
              print(f"{name}={actual} (expected {expected})")
              if actual != expected:
                  failures.append(f"{name}: expected {expected}, got {actual}")

          expect("changes", "success")
          expect("docs-rules", "success")

          # PR metadata checks run for every PR; they are skipped on push/dispatch.
          metadata_result = "success" if event == "pull_request" else "skipped"
          expect("docs-impact", metadata_result)
          expect("cache-impact", metadata_result)

          selected = {
              "lint": any(outputs.get(k) == "true" for k in ("code", "desktop", "workflow")),
              "go": any(outputs.get(k) == "true" for k in ("code", "sdk")),
              "desktop": outputs.get("desktop") == "true",
              "codeql": any(outputs.get(k) == "true" for k in ("code", "desktop", "workflow")),
              # Main push/manual full runs and full PRs include memory.
              "memory": event != "pull_request" or outputs.get("full") == "true",
          }
          for name, needed in selected.items():
              expect(name, "success" if needed else "skipped")

          if failures:
              print("Gate failed:")
              for failure in failures:
                  print(f" - {failure}")
              sys.exit(1)
          print("All selected checks passed; unselected checks were skipped as expected.")
          PY

  # Required companion status for PR metadata. Ordinary PR events validate
  # docs/cache impact in the main Gate; edited events use the trusted target workflow.
  metadata-gate:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Ordinary PR metadata checks are included in Gate."

  # Observability only: it never gates a merge, but it records every job's wall
  # time so a silent regression (for example `test` drifting from 6 to 12
  # minutes) becomes visible instead of anecdotal.
  metrics:
    # needs gate so the artifact always covers the same job set
    # (otherwise gate may or may not have finished when the API is queried).
    needs: [changes, docs-rules, docs-impact, cache-impact, lint, go, desktop, codeql, memory, gate]
    if: ${{ always() && (github.event_name != 'pull_request' || needs.changes.outputs.code == 'true' || needs.changes.outputs.desktop == 'true' || needs.changes.outputs.sdk == 'true' || needs.changes.outputs.workflow == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Summarize job durations
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
            --jq '.jobs[] | @json' > jobs.jsonl
          python3 - <<'PY'
          import json, os, datetime
          rows = []
          for line in open("jobs.jsonl"):
              line = line.strip()
              if not line:
                  continue
              j = json.loads(line)
              s, e = j.get("started_at"), j.get("completed_at")
              if not s or not e:
                  continue
              d = (datetime.datetime.fromisoformat(e.replace("Z", "+00:00"))
                   - datetime.datetime.fromisoformat(s.replace("Z", "+00:00"))).total_seconds() / 60
              rows.append({"job": j["name"], "minutes": round(d, 1), "conclusion": j["conclusion"]})
          rows.sort(key=lambda r: -r["minutes"])
          with open("ci-metrics.json", "w") as fh:
              json.dump({"run_id": os.environ["RUN_ID"], "jobs": rows}, fh, indent=2)
          print(f"{'job':38} {'minutes':>8}  conclusion")
          for r in rows:
              print(f"{r['job']:38} {r['minutes']:>8}  {r['conclusion']}")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: ci-metrics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-metrics.json
          retention-days: 30

  # Actions caches have a hard 10 GB per-repository budget and GitHub evicts
  # entries on its own schedule once it is hit. The CodeQL overlay databases
  # alone are ~200 MB each and get a new key on every run, so they are the real
  # growth source. Keep the newest entry per family after a push to main.
  prune-cache:
    # wait for codeql as well: it writes this run's overlay cache, and pruning
    # before that write leaves two entries in the same family.
    needs: [go, desktop, codeql]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    env:
      PRUNE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      # Only a push to main prunes; on a pull request the job still starts and
      # reports success in seconds so the check list stays all-green.
      - name: Keep the newest cache per family
        if: env.PRUNE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/actions/caches?per_page=100&sort=created_at&direction=desc&ref=refs/heads/main" \
            --jq '.actions_caches[] | @json' > caches.jsonl
          python3 - <<'PY'
          import json, os, subprocess

          codeql_langs = {"go", "javascript", "python", "csharp", "java", "cpp", "ruby", "swift"}

          def family(key):
              if key.startswith("codeql-overlay-base-database-"):
                  # Keep the restore prefix (CLI version + config + language),
                  # drop only the trailing commit SHA, run id and attempt.
                  return key.rsplit("-", 3)[0]
              # setup-go-<os>-<arch>[-<distro>]-go-<ver>-<hash>
              # golangci-lint.cache-<os>[-<dir>]-<pid>-<hash>
              return key.rsplit("-", 1)[0]

          caches = [json.loads(l) for l in open("caches.jsonl") if l.strip()]
          seen, deleted, freed, errors = set(), 0, 0, 0
          for c in caches:  # already newest-first
              fam = family(c["key"])
              if fam in seen:
                  r = subprocess.run(
                      ["gh", "api", "-X", "DELETE", f"repos/{os.environ['REPO']}/actions/caches/{c['id']}"],
                      capture_output=True, text=True,
                  )
                  if r.returncode == 0:
                      deleted += 1
                      freed += c["size_in_bytes"]
                      print(f"deleted {c['size_in_bytes']/1e6:8.1f} MB  {c['key'][:80]}")
                  else:
                      errors += 1
                      print(f"failed  {c['key'][:80]}  {(r.stderr or '')[:80]}")
              else:
                  seen.add(fam)
          print(f"kept {len(seen)} families, deleted {deleted} caches, freed {freed/1e9:.2f} GB")
          if errors:
              raise SystemExit(f"{errors} cache deletions failed; rerun to retry the remainder")
          PY