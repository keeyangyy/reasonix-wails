name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Fallback entry when the platform's push-event pipeline drops a push:
  # dispatch creates the run directly and runs the same matrix.
  workflow_dispatch:

# Windows runners sporadically hit Go runtime preemption failures
# (runtime.preemptM: duplicatehandle failed) unrelated to repo code;
# disabling async preemption there removes that flake class for free.
env:
  GODEBUG: asyncpreemptoff=1

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap path gate for pull requests. Every changed file falls into one of four
  # lanes and the downstream jobs decide how much to run:
  #
  #   DOC   docs/**, release-notes/**, benchmarks/**, tmp/**, root *.md,
  #         LICENSE, .gitignore, .gitattributes, .editorconfig
  #   META  .github/** except workflows (templates, labeler, dependabot, ...)
  #   WF    .github/workflows/** -> workflow contract checks only
  #   CODE  everything else -> full matrix
  #
  # A PR whose diff is entirely DOC/META runs no Go lane; a WF-only diff runs the
  # lint contract step and skips every Go suite; release/* forces the full matrix
  # even when the release PR only edits documents. Pushes to main always run
  # everything.
  #
  # A job-level `if` that skips reports skipped, which does not satisfy a
  # required status check, so the required jobs stay `if: always()` and gate
  # their steps on these outputs. A failed `changes` job fails open (an empty
  # output is not 'false'), so it runs the full matrix instead of silently
  # passing a required check as skipped.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      desktop: ${{ steps.filter.outputs.desktop }}
      desktop_direct: ${{ steps.filter.outputs.desktop_direct }}
      full: ${{ steps.filter.outputs.full }}
      sdk: ${{ steps.filter.outputs.sdk }}
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        run: |
          code=true; desktop=true; sdk=true; workflow=true; desktop_direct=true; full=true
          base=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            base="${{ github.event.before }}"
          fi
          if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            files=$(git diff --name-only "$base" HEAD)
            if [ -n "$files" ]; then
              code=false; desktop=false; sdk=false; workflow=false
              desktop_direct=false; full=false
              # Root-module CI: desktop/ is a separate module, so only this
              # clearly-unrelated set can skip it.
              if echo "$files" | grep -qvE '^(docs/|release-notes/|benchmarks/|tmp/|\.github/|\.agents/|desktop/|[^/]+\.md$|LICENSE$|\.gitignore$|\.gitattributes$|\.editorconfig$|\.coderabbit\.yaml$)'; then
                code=true
              fi
              # desktop/ imports the root kernel via `replace reasonix => ../`,
              # so the same clearly-unrelated set is what skips it.
              if echo "$files" | grep -qvE '^(docs/|release-notes/|benchmarks/|tmp/|\.github/|\.agents/|[^/]+\.md$|LICENSE$|\.gitignore$|\.gitattributes$|\.editorconfig$|\.coderabbit\.yaml$)'; then
                desktop=true
              fi
              # Only a diff that touches desktop/ itself pays for the full
              # desktop matrix (WebView2 shell + the ~25 minute Windows Go
              # suite). A root-module diff still validates that desktop
              # compiles, but the full desktop regression run stays on main.
              if echo "$files" | grep -qE '^desktop/'; then desktop_direct=true; fi
              # sdk/go is a nested module invisible to root `go test ./...`;
              # its DTOs are generated from internal/extension/protocol, so
              # both paths must trigger the sdk job.
              if echo "$files" | grep -qE '^(sdk/|internal/extension/)'; then sdk=true; fi
              # Workflow edits still need actionlint and the release contract
              # scripts, so they keep the lint job's WF step alive.
              if echo "$files" | grep -qE '^\.github/workflows/'; then workflow=true; fi
            fi
          fi
          # `full` marks the runs that must not depend on a diff heuristic:
          # every push to main (the release baseline) and every release/* PR.
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then full=true; fi
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ "${GITHUB_HEAD_REF%%/*}" = "release" ]; then
            code=true; desktop=true; sdk=true; workflow=true; desktop_direct=true; full=true
          fi
          { echo "code=$code"; echo "desktop=$desktop"; echo "desktop_direct=$desktop_direct"; echo "full=$full"; echo "sdk=$sdk"; echo "workflow=$workflow"; } >> "$GITHUB_OUTPUT"

  # The ruleset requires the per-OS check names (test (ubuntu-latest) etc.).
  # A matrix job skipped at job level reports no per-leg checks at all, so
  # those required checks would stay "Expected" and block merging. The job
  # therefore always runs and the steps do the gating: when the changes
  # detector reports the diff is unrelated, every step skips and each leg
  # reports success in seconds. `always()` also keeps the legs alive when
  # the changes job itself fails (fail-open: an empty output != 'false').
  test:
    needs: changes
    if: always()
    # Backstop against a wedged step holding the workflow's concurrency group:
    # the Windows full-suite step has outlived its own timeout and kept the job
    # alive. Normal wall time is ~15-20 minutes now that the flake-prone
    # packages run first; the two step budgets (25 + 25) cap the worst case at
    # 50, so 60 keeps a wedged step from holding the concurrency group.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # fork ships Windows amd64 only; drop the ubuntu/macos legs.
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUN_STEPS: ${{ needs.changes.outputs.code != 'false' }}
    steps:
      - if: env.RUN_STEPS == 'true'
        uses: actions/checkout@v7

      - if: env.RUN_STEPS == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install and verify Linux sandbox backend
        if: env.RUN_STEPS == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if sysctl -n kernel.unprivileged_userns_clone >/dev/null 2>&1; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --ro-bind / / --dev /dev --proc /proc -- true || \
            echo "::warning::bubblewrap is installed but this runner denies user namespaces; unavailable-backend tests will run fail-closed"

      - name: vet
        if: env.RUN_STEPS == 'true'
        run: go vet ./...

      - name: build
        if: env.RUN_STEPS == 'true'
        run: go build ./...

      # Pull requests run a Windows smoke suite: the packages that actually
      # carry *_windows.go code, the startup/checkpoint packages with portable
      # filesystem contracts, plus cmd/. The full ./... sweep stays on pushes
      # to main; on pull requests the `coverage` job is the full-suite gate.
      # Keep the job-level
      # budget above normal 7-9 minute runner variance; each package test binary
      # remains independently bounded by Go's per-package timeout below.
      #
      # That timeout is 8m, not 3m: across four consecutive runs of the same
      # code, internal/boot measured 133s, 146s, 162s and then hit 180s, and
      # internal/agent 82s, 92s, 144s and 180s — a 2.2x spread from runner
      # variance alone, with four heavy packages sharing four vCPUs. At 3m the
      # step failed on slow runners without a code change; a hang still trips
      # the 15 minute job budget above. internal/control runs in its own
      # Windows job below so its durable-session I/O does not compete here.
      - name: test (Windows smoke)
        if: env.RUN_STEPS == 'true' && runner.os == 'Windows' && github.event_name == 'pull_request'
        timeout-minutes: 15
        env:
          REASONIX_RELEASE_CACHE_GUARD: "1"
          WINDOWS_SANDBOX_WAIT_MS: "20000"
        run: go test -p 4 -timeout=8m ./internal/agent/... ./internal/appidentity/... ./internal/boot/... ./internal/checkpoint/... ./internal/cli/... ./internal/desktoplauncher/... ./internal/filelock/... ./internal/fileutil/... ./internal/hook/... ./internal/instruction/... ./internal/mcplaunch/... ./internal/notify/... ./internal/proc/... ./internal/repair/... ./internal/sandbox/... ./internal/sessioncatalog/... ./internal/sysproxy/... ./internal/workspacelease/... ./cmd/...

      # The general Windows PR smoke list intentionally omits internal/tool.
      # Keep the session-temp portability contract covered without widening the
      # leg to every tool test: two real PowerShell launches must share the
      # injected TMPDIR/TMP/TEMP directory.
      - name: test (Windows session temp)
        if: env.RUN_STEPS == 'true' && runner.os == 'Windows' && github.event_name == 'pull_request'
        timeout-minutes: 3
        run: go test -timeout=2m -run '^TestBashSharesSessionTempAcrossCalls$' ./internal/tool/builtin

      # Shell execution contract: PowerShell identity, Chinese workspace paths,
      # UTF-8 output, and ExitCode retention must gate PRs on native Windows.
      # Keep this focused (not full ./internal/tool) so the smoke budget holds.
      - name: test (Windows shell execution contract)
        if: env.RUN_STEPS == 'true' && runner.os == 'Windows' && github.event_name == 'pull_request'
        timeout-minutes: 5
        run: go test -timeout=3m -run '^TestBashPowerShellExecuteDetailedContract$|^TestBashPowerShell51PreflightRejectsAndAndDetailed$|^TestBashPowerShellOutputIsUTF8$|^TestBashPowerShellSurfacesNonZeroExit$|^TestBashPowerShellRejectsChaining$' ./internal/tool/builtin

      # The packages below carry this lane's flake history: internal/bot dies in
      # a Windows runtime crash (register dump, rip=0x0, stack top
      # bot.(*BotGateway).runTurnItem), internal/plugin has blown the 8m package
      # budget, and internal/agent is the heaviest package on the lane. Run them
      # one at a time so a crash costs one package retry (~seconds) instead of
      # failing the whole sweep. internal/control already has its own Windows job.
      - name: test (flake-prone packages)
        if: env.RUN_STEPS == 'true' && runner.os == 'Windows' && github.event_name != 'pull_request'
        timeout-minutes: 25
        shell: bash
        env:
          # Run the prompt-cache prefix-stability guard (TestCacheHit*) in CI: a
          # regression there silently tanks the cache hit rate the project is
          # built around.
          REASONIX_RELEASE_CACHE_GUARD: "1"
          # Bound sandbox helper children in Windows tests so a failed OS-level
          # launch cannot pin the Actions step after Go's package timeout fires.
          WINDOWS_SANDBOX_WAIT_MS: "20000"
        run: |
          set -o pipefail
          status=0
          for pkg in ./internal/bot ./internal/plugin ./internal/agent; do
            for attempt in 1 2; do
              if output="$(go test -p 1 -timeout=8m "$pkg" 2>&1)"; then
                printf '%s\n' "$output"
                break
              fi
              status=$?
              # Only the known Windows runtime/OS-level faults and the package
              # timeout retry here. A package timeout is retried *only* in this
              # step: it costs one package (~8m) rather than a whole sweep, and
              # these three are exactly the packages that blow the budget on a
              # loaded runner. Anything else stays red immediately.
              if ! printf '%s' "$output" | grep -Eq "found pointer to free object|fatal error: fault|fatal error: unknown caller pc|runtime: netpoll failed|runtime.semasleep|runtime.semawakeup|waitforsingleobject wait_failed|setevent failed|unexpected return pc|TempDir RemoveAll cleanup|panic: test timed out after|: timed out|timed out waiting for|timed out after [0-9]+|the turn never closed|go: unlinkat|exceeded its total test deadline"; then
                printf '%s\n' "$output"
                exit "$status"
              fi
              if [ "$attempt" = "2" ]; then
                printf '%s\n' "$output"
                exit "$status"
              fi
              echo "::warning::$pkg matched a known Windows flake; retrying once"
              sleep 5
            done
          done

      # Full push suite still uses the same 8m package budget as Windows smoke:
      # agent/boot/control already hit 180s package timeouts under runner load,
      # so 3m fails on slow machines without a code regression. Keep the step
      # above normal full-suite wall time (~8-12m) so a hang still dies on the
      # job budget rather than a false package timeout — and high enough to fit
      # the whitelisted-flake retry: one full sweep plus a targeted re-run of
      # the failed packages. The old 20-minute budget could not fit that, which
      # is why a single whitelisted flake used to turn this step red.
      - name: test (full)
        if: env.RUN_STEPS == 'true' && runner.os == 'Windows' && github.event_name != 'pull_request'
        timeout-minutes: 25
        shell: bash
        env:
          # Run the prompt-cache prefix-stability guard (TestCacheHit*) in CI: a
          # regression there silently tanks the cache hit rate the project is
          # built around.
          REASONIX_RELEASE_CACHE_GUARD: "1"
          # Bound sandbox helper children in Windows tests so a failed OS-level
          # launch cannot pin the Actions step after Go's package timeout fires.
          WINDOWS_SANDBOX_WAIT_MS: "20000"
        run: |
          set -o pipefail
          output=""
          status=0
          for attempt in 1 2; do
            # The first pass sweeps everything except the flake-prone packages
            # covered above; the retry targets only the packages that failed,
            # one at a time.
            if [ "$attempt" = 1 ]; then
              packages="$(go list ./... | grep -Ev '^reasonix/internal/(bot|plugin|agent)$' | paste -sd' ' -)"
              parallel=4
            else
              packages="$(printf '%s\n' "$output" | awk -F'\t' '/^FAIL[[:space:]]+reasonix/{print $2}' | sort -u | paste -sd' ' -)"
              if [ -z "$packages" ]; then
                packages="./..."
              fi
              parallel=1
              # No GOMAXPROCS override: setting it starts the runtime's
              # GOMAXPROCS-updater goroutine, which is itself a crash site on
              # these runners. -p 1 is enough.
              echo "::warning::retrying only the failed packages: $packages (-p 1)"
            fi
            # shellcheck disable=SC2086  # $packages is intentionally word-split
            if output="$(go test -p "$parallel" -timeout=8m $packages 2>&1)"; then
              printf '%s\n' "$output"
              exit 0
            else
              status=$?
            fi
            # go test's own whole-process timeout (`panic: test timed out
            # after 8m0s` under -timeout=8m) is NOT retried: it usually means
            # a deadlock or a genuine hang, so a rerun would burn another 8
            # minutes and would not meaningfully pass. Exit immediately.
            if printf '%s' "$output" | grep -Eq "panic: test timed out after"; then
              printf '%s\n' "$output"
              exit "$status"
            fi
            # Only retry two classes of flake that reliably pass on a rerun;
            # any other failure stays red immediately so CI semantics are
            # preserved:
            #   1. the known Windows runtime crash (internal/bot preemption),
            #      surfaced by the free-object fault, "unknown caller pc", and
            #      an unexpected-return-pc frame (stack top
            #      bot.(*BotGateway).runTurnItem);
            #   2. a short per-operation timeout built into a test (": timed
            #      out", "timed out waiting for ...", "... timed out after
            #      30s"). It only trips on loaded/slow runners, never
            #      reproduces locally, and passes on a rerun. The branch above
            #      already excluded go test's process-level timeout, so these
            #      patterns cannot match the deadlock case.
            #   3. a TempDir cleanup race ("TempDir RemoveAll cleanup: ... is not
            #      empty"): a background writer still touches the directory while
            #      t.TempDir() removes it. Same class: slow runners only, passes
            #      on a rerun.
            #   4. a Windows runner runtime crash ("runtime: SetWaitableTimer
            #      failed; errno= 6" -> "fatal error: runtime: netpoll failed",
            #      or the semaphore siblings "runtime: waitforsingleobject
            #      wait_failed; errno=6" -> "fatal error: runtime.semasleep
            #      wait_failed" / ".semawakeup"): an OS/runtime-level fault on
            #      hosted runners that kills the whole test process mid-package;
            #      not reproducible from the code under test, passes on a rerun.
            if ! printf '%s' "$output" | grep -Eq "found pointer to free object|fatal error: fault|fatal error: unknown caller pc|runtime: netpoll failed|runtime.semasleep|runtime.semawakeup|waitforsingleobject wait_failed|setevent failed|unexpected return pc|TempDir RemoveAll cleanup|: timed out|timed out waiting for|timed out after [0-9]+|the turn never closed|go: unlinkat"; then
              printf '%s\n' "$output"
              exit "$status"
            fi
            echo "::warning::known Windows runtime flake or test-internal timeout matched; retrying test (full) attempt $attempt"
            sleep 5
          done
          printf '%s\n' "$output"
          exit "$status"

      - name: test (Scoop desktop launch)
        if: env.RUN_STEPS == 'true' && runner.os == 'Windows'
        timeout-minutes: 10
        shell: powershell
        run: .\scripts\test-scoop-desktop-launch.ps1

  windows-control:
    needs: changes
    if: always()
    runs-on: windows-latest
    env:
      RUN_STEPS: ${{ needs.changes.outputs.code != 'false' }}
    steps:
      - if: env.RUN_STEPS == 'true'
        uses: actions/checkout@v7

      - if: env.RUN_STEPS == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: test
        if: env.RUN_STEPS == 'true'
        timeout-minutes: 10
        env:
          REASONIX_RELEASE_CACHE_GUARD: "1"
          WINDOWS_SANDBOX_WAIT_MS: "20000"
        run: go test -p 1 -timeout=8m ./internal/control/...

  race:
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    env:
      RUN_STEPS: ${{ needs.changes.outputs.code != 'false' }}
    steps:
      - if: env.RUN_STEPS == 'true'
        uses: actions/checkout@v7

      - if: env.RUN_STEPS == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install and verify Linux sandbox backend
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if sysctl -n kernel.unprivileged_userns_clone >/dev/null 2>&1; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --ro-bind / / --dev /dev --proc /proc -- true || \
            echo "::warning::bubblewrap is installed but this runner denies user namespaces; unavailable-backend tests will run fail-closed"

      # The matrix never runs -race (it needs cgo); the project's concurrency
      # (plugin fan-out, background phase B, jobs Kill/Wait) would otherwise
      # ship without race coverage. Pull requests sweep only the
      # concurrency-heavy packages so this required check stays fast; pushes
      # to main keep the full ./... sweep as the safety net.
      - name: test -race (concurrency packages)
        if: github.event_name == 'pull_request'
        env:
          REASONIX_RELEASE_CACHE_GUARD: "1"
        run: go test -race ./internal/agent/... ./internal/plugin/... ./internal/jobs/... ./internal/proc/... ./internal/sandbox/... ./internal/filelock/... ./internal/eventwire/... ./internal/extension/... ./internal/boot/... ./internal/control/... ./internal/tool/...

      - name: test -race (full)
        if: github.event_name != 'pull_request'
        env:
          REASONIX_RELEASE_CACHE_GUARD: "1"
        run: |
          set -o pipefail
          output=""
          status=0
          for attempt in 1 2; do
            if output="$(go test -race ./... 2>&1)"; then
              printf '%s\n' "$output"
              exit 0
            else
              status=$?
            fi
            # go test's own whole-process timeout (panic: test timed out
            # after ... under the default -timeout) is NOT retried: it usually
            # means a deadlock or a genuine hang, so a rerun would not
            # meaningfully pass. Exit immediately.
            if printf '%s' "$output" | grep -Eq "panic: test timed out after"; then
              printf '%s\n' "$output"
              exit "$status"
            fi
            # Only retry two classes of flake that reliably pass on a rerun;
            # any other failure stays red immediately:
            #   1. the known race flake (internal/plugin cache test);
            #   2. a short per-operation timeout built into a test (": timed
            #      out", "timed out waiting for ...", "... timed out after
            #      30s"). It only trips on loaded/slow runners, never
            #      reproduces locally, and passes on a rerun. The branch above
            #      already excluded go test's process-level timeout.
            #   3. a TempDir cleanup race ("TempDir RemoveAll cleanup: ... is not
            #      empty"): a background writer still touches the directory while
            #      t.TempDir() removes it. Same class: slow runners only, passes
            #      on a rerun.
            if ! printf '%s' "$output" | grep -Eq "FAIL: TestLazyCacheMissAsyncSpawn|FAIL[[:space:]]+reasonix/internal/plugin|TempDir RemoveAll cleanup|: timed out|timed out waiting for|timed out after [0-9]+|the turn never closed|go: unlinkat"; then
              printf '%s\n' "$output"
              exit "$status"
            fi
            echo "::warning::known race flake or test-internal timeout matched; retrying test -race attempt $attempt"
            sleep 5
          done
          printf '%s\n' "$output"
          exit "$status"

  # sdk/go is a nested stdlib-only module invisible to root `go test ./...`.
  # Its DTOs are generated from internal/extension/protocol, and the
  # host-side conformance tests spawn the SDK example, so the job runs the
  # same three-OS matrix as the root tests.
  sdk:
    needs: changes
    if: always()
    strategy:
      fail-fast: false
      matrix:
        # fork ships Windows amd64 only; drop the ubuntu/macos legs.
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUN_STEPS: ${{ needs.changes.outputs.sdk != 'false' }}
    defaults:
      run:
        working-directory: sdk/go
    steps:
      - if: env.RUN_STEPS == 'true'
        uses: actions/checkout@v7

      - if: env.RUN_STEPS == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: sdk/go/go.mod

      - name: gofmt
        if: env.RUN_STEPS == 'true'
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        if: env.RUN_STEPS == 'true'
        run: go vet ./...

      - name: stdlib-only guard
        if: env.RUN_STEPS == 'true'
        shell: bash
        run: |
          # The SDK is a public module with a hard stdlib-only contract.
          if go list -m all | grep -v '^github.com/esengine/DeepSeek-Reasonix/sdk/go$'; then
            echo "sdk/go must not depend on anything outside the standard library"
            exit 1
          fi

      - name: test
        if: env.RUN_STEPS == 'true'
        run: go test ./...

      - name: test -race
        if: github.event_name != 'pull_request' && env.RUN_STEPS == 'true'
        run: go test -race ./...

  # Single required check for the desktop module: the ruleset requires this
  # aggregate, so the per-lane jobs can be renamed or split without silently
  # disabling the gate. Linux lanes must run whenever the diff can reach the
  # module; the two Windows lanes only run for a desktop/** diff or an
  # exhaustive run (push to main, release/*), so they are allowed to skip on an
  # ordinary root-module PR.
  desktop:
    needs: [changes, desktop-prepare, desktop-go, desktop-frontend, desktop-browser, desktop-windows, desktop-windows-go]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify desktop validation jobs
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          SHOULD_RUN: ${{ needs.changes.outputs.desktop != 'false' }}
          WINDOWS_RUN: ${{ needs.changes.outputs.desktop_direct != 'false' || needs.changes.outputs.full != 'false' }}
          PREPARE_RESULT: ${{ needs.desktop-prepare.result }}
          GO_RESULT: ${{ needs.desktop-go.result }}
          FRONTEND_RESULT: ${{ needs.desktop-frontend.result }}
          BROWSER_RESULT: ${{ needs.desktop-browser.result }}
          WINDOWS_RESULT: ${{ needs.desktop-windows.result }}
          WINDOWS_GO_RESULT: ${{ needs.desktop-windows-go.result }}
        run: |
          test "$CHANGES_RESULT" = success
          linux_expected=skipped
          if [ "$SHOULD_RUN" = true ]; then linux_expected=success; fi
          windows_expected=skipped
          if [ "$WINDOWS_RUN" = true ]; then windows_expected=success; fi
          for pair in "prepare:$PREPARE_RESULT" "go:$GO_RESULT" "frontend:$FRONTEND_RESULT" "browser:$BROWSER_RESULT"; do
            lane=${pair%%:*}; result=${pair#*:}
            echo "$lane: $result (expected $linux_expected)"
            test "$result" = "$linux_expected"
          done
          for pair in "windows:$WINDOWS_RESULT" "windows-go:$WINDOWS_GO_RESULT"; do
            lane=${pair%%:*}; result=${pair#*:}
            echo "$lane: $result (expected $windows_expected)"
            test "$result" = "$windows_expected"
          done

  desktop-frontend:
    needs: [changes, desktop-prepare]
    if: always() && needs.desktop-prepare.result == 'success' && (needs.changes.outputs.desktop != 'false')
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: desktop/frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.desktop-prepare.outputs.artifact_name }}
          path: desktop/frontend
      - name: Verify CI test coverage and runner
        run: node --test frontend/scripts/ci-test-plan.test.mjs
      - name: Test desktop frontend once per suite
        env:
          REASONIX_TEST_CONCURRENCY: "2"
        run: node frontend/scripts/run-ci-tests.mjs

  desktop-browser:
    needs: [changes, desktop-prepare]
    if: always() && needs.desktop-prepare.result == 'success' && (needs.changes.outputs.desktop != 'false')
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: desktop/frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.desktop-prepare.outputs.artifact_name }}
          path: desktop/frontend
      - name: Install browser runtimes
        run: PLAYWRIGHT_BROWSERS_PATH=.pw-browsers pnpm --dir frontend exec playwright install --with-deps chromium webkit
      - name: Test desktop browser contracts
        run: |
          pnpm --dir frontend test:motion-browser
          PLAYWRIGHT_BROWSERS_PATH=.pw-browsers pnpm --dir frontend test:app-browser
          PLAYWRIGHT_BROWSERS_PATH=.pw-browsers REASONIX_SETTINGS_BROWSERS=chromium,webkit pnpm --dir frontend test:settings-browser
          xvfb-run -a env REASONIX_TRANSCRIPT_NATIVE_THUMB=1 pnpm --dir frontend test:transcript-browser
          PLAYWRIGHT_BROWSERS_PATH=.pw-browsers pnpm --dir frontend test:transcript-reader-browser

  desktop-prepare:
    needs: changes
    if: always() && (needs.changes.outputs.desktop != 'false')
    outputs:
      artifact_name: desktop-frontend-${{ github.run_id }}-${{ github.run_attempt }}
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: desktop/go.mod
          cache: true
          cache-dependency-path: desktop/go.sum

      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: desktop/frontend/pnpm-lock.yaml

      - name: Install Wails CLI
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          go install "github.com/wailsapp/wails/v2/cmd/wails@$(cat "$GITHUB_WORKSPACE/.wails-version")"

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go.mod tidy
        run: |
          go mod tidy
          if ! git diff --quiet -- go.mod go.sum; then
            echo "desktop/go.mod or go.sum is stale - run 'cd desktop && go mod tidy' and commit."
            git diff -- go.mod go.sum
            exit 1
          fi

      # WebKitGTK 4.0 toolchain (pinned to ubuntu-22.04; no webkit2_41 tag).
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus-daemon gcc libgtk-3-dev libwebkit2gtk-4.0-dev xvfb

      - name: Build frontend
        run: |
          wails generate module
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend build

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-frontend-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            desktop/frontend/dist
            desktop/frontend/wailsjs
          if-no-files-found: error
          retention-days: 3

  desktop-go:
    needs: [changes, desktop-prepare]
    if: always() && needs.desktop-prepare.result == 'success' && (needs.changes.outputs.desktop != 'false')
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: desktop/go.mod
          cache: true
          cache-dependency-path: desktop/go.sum

      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: desktop/frontend/pnpm-lock.yaml

      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.desktop-prepare.outputs.artifact_name }}
          path: desktop/frontend
      - run: pnpm --dir frontend install --frozen-lockfile

      # WebKitGTK 4.0 toolchain (pinned to ubuntu-22.04; no webkit2_41 tag).
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus-daemon gcc libgtk-3-dev libwebkit2gtk-4.0-dev xvfb

      # The native/UI regression steps below only run when the diff touches
      # desktop/ itself or when the run must be exhaustive (push to main,
      # release/*). A root-module diff still compiles the module via
      # vet/golangci-lint/build, but the WebKitGTK and full-suite runs stay on
      # the exhaustive path so a normal PR does not pay ~13 minutes for them.
      - name: Test WebKitGTK native transcript scrolling
        if: needs.changes.outputs.desktop_direct != 'false' || needs.changes.outputs.full != 'false'
        timeout-minutes: 5
        run: |
          pnpm --dir frontend exec vite preview --host 127.0.0.1 --port 4173 --strictPort >/tmp/reasonix-transcript-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 100); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep 0.1
          done
          xvfb-run -a env WEBKIT_DISABLE_COMPOSITING_MODE=1 go run -tags reasonix_transcript_smoke ./cmd/transcript-native-smoke \
            -url 'http://127.0.0.1:4173/?mock=bench&bench=1' \
            -script transcript_native_smoke_contract.js

      - name: vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: desktop
          args: --timeout=5m

      - name: build
        run: go build ./...

      - name: test
        if: needs.changes.outputs.desktop_direct != 'false' || needs.changes.outputs.full != 'false'
        run: go test ./...

      - name: WebKitGTK 4.0 native recovery smoke
        if: needs.changes.outputs.desktop_direct != 'false' || needs.changes.outputs.full != 'false'
        run: xvfb-run -a env WEBKIT_DISABLE_COMPOSITING_MODE=1 go test -tags reasonix_webkit_smoke . -run '^TestWebKitNativeRecoverySmoke$'

      # The extension work added new shared-state paths to the desktop
      # runtime (tab/rebuild fences, extension UI). Race-sweep the module so
      # regressions are CI-blocked, not just author-verified locally.
      - name: test -race
        if: needs.changes.outputs.desktop_direct != 'false' || needs.changes.outputs.full != 'false'
        run: go test -race ./...

  # Runs always and gates its steps on the diff class: a job-level `if` that
  # skipped would leave a grey `skipped` row in the PR check list, and the merge
  # rule requires every produced check to be green (see
  # .agents/rules/workflow.md). The expensive steps only execute when the diff
  # touches desktop/ or the run is exhaustive.
  desktop-windows:
    needs: changes
    if: always()
    runs-on: windows-latest
    # A hung native step must not hold the workflow's concurrency group for the
    # six-hour default. Normal runs finish in ~25 minutes.
    timeout-minutes: 45
    env:
      RUN_STEPS: ${{ needs.changes.outputs.desktop_direct != 'false' || needs.changes.outputs.full != 'false' }}
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - if: env.RUN_STEPS == 'true'
        uses: actions/checkout@v7

      - if: env.RUN_STEPS == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: desktop/go.mod
          cache: true
          cache-dependency-path: desktop/go.sum

      - if: env.RUN_STEPS == 'true'
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 10
          run_install: false

      - if: env.RUN_STEPS == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: desktop/frontend/pnpm-lock.yaml

      - name: Install Wails CLI
        if: env.RUN_STEPS == 'true'
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          go install "github.com/wailsapp/wails/v2/cmd/wails@$(cat "$GITHUB_WORKSPACE/.wails-version")"

      # go:embed of frontend/dist needs a built frontend before the package
      # compiles, same as the ubuntu desktop leg.
      - name: Build frontend
        if: env.RUN_STEPS == 'true'
        run: |
          wails generate module
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend build

      - name: Test native motion contracts
        if: env.RUN_STEPS == 'true'
        run: pnpm --dir frontend test:motion

      # Chromium is the closest deterministic browser replay available on the
      # Windows runner; the native smoke below separately exercises the actual
      # installed WebView2 runtime. Keep both paths so transcript geometry is
      # covered before the shell-level smoke starts.
      - name: Test transcript browser replay on Windows
        if: env.RUN_STEPS == 'true'
        timeout-minutes: 10
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/desktop/frontend/.pw-browsers
        run: |
          pnpm --dir frontend exec playwright install chromium
          pnpm --dir frontend test:transcript-browser

      - name: Test settings layout on Windows
        if: env.RUN_STEPS == 'true'
        timeout-minutes: 5
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/desktop/frontend/.pw-browsers
        run: pnpm --dir frontend test:settings-browser

      - name: Test WebView2 native transcript and composer scrolling
        if: env.RUN_STEPS == 'true'
        timeout-minutes: 5
        run: |
          pnpm --dir frontend exec vite preview --host 127.0.0.1 --port 4173 --strictPort > "$RUNNER_TEMP/reasonix-transcript-preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 100); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep 0.1
          done
          go run -tags reasonix_transcript_smoke ./cmd/transcript-native-smoke \
            -url 'http://127.0.0.1:4173/?mock=bench&bench=1&nativeComposer=1' \
            -script transcript_native_smoke_contract.js

      - name: Test WebView2 native smoke state machine
        if: env.RUN_STEPS == 'true'
        shell: pwsh
        run: ../scripts/test-webview2-native-smoke.ps1 -SelfTest

      - name: Test WebView2 transcript selection compositor
        if: env.RUN_STEPS == 'true'
        shell: pwsh
        timeout-minutes: 5
        run: ../scripts/test-transcript-selection-webview2.ps1 -Iterations 3

      - name: Upload WebView2 transcript selection evidence
        if: failure() && env.RUN_STEPS == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: webview2-transcript-selection-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/reasonix-transcript-selection-smoke
          if-no-files-found: warn
          retention-days: 14

      # Build the real Wails executable on every desktop PR and exercise the
      # exact production startup path in Microsoft's installed WebView2 runtime.
      # The frontend and bindings were already built above, so this skips only
      # duplicate build work, not the native shell.
      - name: Build Wails executable for native startup smoke
        if: env.RUN_STEPS == 'true'
        timeout-minutes: 10
        run: wails build -clean -s -skipbindings -nopackage -platform windows/amd64 -webview2 embed

      - name: Smoke-test Wails/WebView2 native startup
        if: env.RUN_STEPS == 'true'
        shell: pwsh
        timeout-minutes: 2
        run: |
          $output = $null
          $code = 0
          foreach ($attempt in 1..2) {
            $output = & ../scripts/test-webview2-native-smoke.ps1 `
              -ExecutablePath "build/bin/reasonix-wails.exe" `
              -TimeoutSeconds 60 `
              -HealthySeconds 5 2>&1
            $code = $LASTEXITCODE
            if ($code -eq 0) { $output; exit 0 }
            # The whole-process go test timeout (panic: test timed out after
            # ...) is NOT retried: it usually means a deadlock or a genuine
            # hang, so a rerun would not meaningfully pass. Exit immediately.
            if ($output -match 'panic: test timed out after') { $output; exit $code }
            # Only retry two classes of flake that reliably pass on a rerun;
            # any other failure stays red immediately:
            #   1. the known CI-vanilla WebView2 flake (rejected the graceful
            #      close request);
            #   2. a short per-operation timeout built into a test (": timed
            #      out", "timed out waiting for ...", "... timed out after
            #      30s"). It only trips on loaded/slow runners, never
            #      reproduces locally, and passes on a rerun. The branch above
            #      already excluded go test's process-level timeout.
            #   3. a TempDir cleanup race ("TempDir RemoveAll cleanup: ... is not
            #      empty"): a background writer still touches the directory while
            #      t.TempDir() removes it. Same class: slow runners only, passes
            #      on a rerun.
            if ($output -notmatch 'rejected the graceful close request|TempDir RemoveAll cleanup|: timed out|timed out waiting for|timed out after \d+') { $output; exit $code }
            Write-Warning "known WebView2 smoke flake or test-internal timeout matched; retrying attempt $attempt"
            Start-Sleep -Seconds 5
          }
          $output
          exit $code

      # The desktop Go suite lives in its own job (`desktop-windows-go`) so the
      # Windows rebuild of the cgo packages overlaps the WebView2 smoke work
      # here instead of extending it.

      # Installer packaging is intentionally NOT re-run here: the Wails
      # executable itself is already built and startup-smoked above, and the
      # release pipeline builds the real installer/archive on every tag.
      # Duplicating packaging per push cost ~6 minutes of Windows runner time
      # while its artifacts (v0.0.0-ci canary) were never consumed.

  # The desktop Go suite is the longest single thing on this lane (~23 minutes:
  # a Windows rebuild of the cgo/Wails packages plus ~6 minutes of tests). Its
  # own job lets that rebuild overlap the WebView2 smoke work in
  # `desktop-windows` instead of extending it, and it needs neither pnpm nor a
  # built frontend.
  desktop-windows-go:
    needs: changes
    if: always()
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      RUN_STEPS: ${{ needs.changes.outputs.desktop_direct != 'false' || needs.changes.outputs.full != 'false' }}
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - if: env.RUN_STEPS == 'true'
        uses: actions/checkout@v7

      - if: env.RUN_STEPS == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: desktop/go.mod
          cache: true
          cache-dependency-path: desktop/go.sum

      - name: test (Windows desktop and update helper)
        if: env.RUN_STEPS == 'true'
        # Normal wall time is ~6-7 minutes of tests plus a Windows rebuild of
        # the cgo packages; a loaded runner has exceeded 15 minutes with every
        # package still passing. Keep the budget above that load spike so the
        # job-level timeout, not this step, ends a real hang.
        timeout-minutes: 30
        run: go test ./...

      - name: test (vendored systray identity)
        if: env.RUN_STEPS == 'true'
        timeout-minutes: 2
        run: go test -timeout=60s fyne.io/systray

      # A cold nested-module cache can spend several minutes compiling the
      # real WebView2 cookie integration test. Keep its budget independent of
      # the desktop suite and retain a Go timeout stack dump.
      - name: test (vendored WebView2 edge)
        if: env.RUN_STEPS == 'true'
        timeout-minutes: 10
        run: (cd third_party/go-webview2 && go test -timeout=8m ./pkg/edge)

  # repolint scans desktop/ and sdk/ too, so this job also covers diffs the
  # `code` filter would otherwise skip. lint is a required check, so the job
  # always runs: a job-level `if` that skipped would leave the required check
  # unanswered on a docs-only PR. The steps gate on the diff class instead.
  lint:
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    env:
      CODE: ${{ needs.changes.outputs.code != 'false' }}
      DESKTOP: ${{ needs.changes.outputs.desktop != 'false' }}
      SDK: ${{ needs.changes.outputs.sdk != 'false' }}
      WF: ${{ needs.changes.outputs.workflow != 'false' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - if: env.DESKTOP == 'true'
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 10
          run_install: false

      - if: env.DESKTOP == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: desktop/frontend/pnpm-lock.yaml

      - name: required native motion contracts
        if: env.DESKTOP == 'true'
        run: |
          pnpm --dir desktop/frontend install --frozen-lockfile
          pnpm --dir desktop/frontend test:motion

      # Runs for every diff class, docs-only included: repolint also enforces
      # the document and comment shape rules.
      - name: repo standards
        run: go run ./tools/repolint

      # Moved here from the old Linux leg of `test` (that leg no longer exists).
      # gofmt output is OS-independent, and a Windows runner stages CRLF, which
      # would flag every file.
      - name: gofmt
        if: env.CODE == 'true' || env.DESKTOP == 'true'
        run: |
          # Root module only — desktop/ is a separate module with its own gofmt
          # step in desktop-prepare.
          unformatted=$(gofmt -l . | grep -v '^desktop/' || true)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: wails version pin
        if: env.CODE == 'true' || env.DESKTOP == 'true'
        run: |
          bash scripts/check-wails-pin.sh
          bash scripts/check-wails-pin.test.sh

      # `make lint-install` reads the same file, so a local run and this job
      # cannot drift onto different linter versions.
      - id: golangci
        if: env.CODE == 'true' || env.DESKTOP == 'true'
        run: echo "version=$(cat .golangci-version)" >> "$GITHUB_OUTPUT"

      - name: golangci-lint
        if: env.CODE == 'true' || env.DESKTOP == 'true'
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ steps.golangci.outputs.version }}
          args: --timeout=5m

      # The step above only type-checks the linux/amd64 build, so every
      # //go:build windows and //go:build darwin file in the tree went unlinted.
      # Both modules cross-check without a toolchain; desktop under darwin does
      # not, because its watchdog is cgo, so that leg lives in desktop-macos.
      - name: golangci-lint (Windows build tags)
        if: env.CODE == 'true' || env.DESKTOP == 'true'
        run: |
          set -euo pipefail
          command -v golangci-lint
          for target in "windows ." "windows desktop"; do
            read -r target_os target_dir <<< "$target"
            echo "::group::golangci-lint GOOS=$target_os ($target_dir)"
            (cd "$target_dir" && GOOS="$target_os" golangci-lint run --timeout=5m ./...)
            echo "::endgroup::"
          done

      # Workflow-only PRs reach this step even though every Go lane skips them.
      - name: release workflow contracts
        if: env.CODE == 'true' || env.DESKTOP == 'true' || env.WF == 'true'
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/*.yml
          node --test scripts/desktop-release-artifacts.test.mjs scripts/ci-workflow.test.mjs
          bash scripts/update-versions-index.test.sh
          node scripts/check-single-release-public-contract.mjs

  # Required: the Go toolchain is pinned through go.mod's `toolchain`, so a
  # stdlib advisory is fixable in-repo instead of being reported forever. The
  # job always runs so a docs-only PR still reports a conclusion.
  govulncheck:
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    env:
      RUN_STEPS: ${{ needs.changes.outputs.code != 'false' }}
    steps:
      - if: env.RUN_STEPS == 'true'
        uses: actions/checkout@v7

      - if: env.RUN_STEPS == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: install govulncheck
        if: env.RUN_STEPS == 'true'
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: govulncheck
        if: env.RUN_STEPS == 'true'
        run: govulncheck ./...

  # The PR-side full-suite gate: `test` only runs a Windows smoke subset, so
  # this job is what actually sweeps the root module on a pull request. It is a
  # required check, hence always-on with step gating.
  coverage:
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    env:
      RUN_STEPS: ${{ needs.changes.outputs.code != 'false' }}
    steps:
      - if: env.RUN_STEPS == 'true'
        uses: actions/checkout@v7

      - if: env.RUN_STEPS == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: test with coverage
        if: env.RUN_STEPS == 'true'
        run: go test -coverprofile=coverage.out -covermode=atomic ./...

      - name: upload coverage
        if: env.RUN_STEPS == 'true' && success()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 7
