name: CI (code)

# Everything that is not documentation: code, workflows, desktop, sdk, scripts.
# The paths-ignore list must mirror ci-docs.yml's `paths` exactly, so a PR
# never starts both entry points.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "plan/**"
      - "plan/**"
      - ".agents/**"
      - "release-notes/**"
      - "benchmarks/**"
      - "tmp/**"
      - "*.md"
      - "LICENSE"
      - ".gitignore"
      - ".gitattributes"
      - ".editorconfig"
      - ".coderabbit.yaml"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
      - ".github/labeler.yml"
      - ".github/dependabot.yml"
  workflow_dispatch:

permissions:
  contents: read
  # check-codeql needs these; a reusable workflow cannot exceed the caller's
  # permissions, so they have to be granted here as well.
  security-events: write
  packages: read
  actions: read

concurrency:
  group: ci-code-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    uses: ./.github/workflows/check-changes.yml

  docs-rules:
    uses: ./.github/workflows/check-docs-rules.yml

  lint:
    needs: changes
    uses: ./.github/workflows/check-lint.yml
    with:
      code: ${{ needs.changes.outputs.code }}
      desktop: ${{ needs.changes.outputs.desktop }}
      workflow: ${{ needs.changes.outputs.workflow }}

  go:
    needs: changes
    uses: ./.github/workflows/check-go.yml
    with:
      code: ${{ needs.changes.outputs.code }}
      sdk: ${{ needs.changes.outputs.sdk }}

  desktop:
    needs: changes
    uses: ./.github/workflows/check-desktop.yml
    with:
      desktop: ${{ needs.changes.outputs.desktop }}
      desktop_direct: ${{ needs.changes.outputs.desktop_direct }}
      full: ${{ needs.changes.outputs.full }}
      changes_ok: ${{ needs.changes.result }}

  codeql:
    needs: changes
    uses: ./.github/workflows/check-codeql.yml
    with:
      code: ${{ needs.changes.outputs.code }}
      desktop: ${{ needs.changes.outputs.desktop }}
      workflow: ${{ needs.changes.outputs.workflow }}

  gate:
    needs: [changes, docs-rules, lint, go, desktop, codeql]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify every job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key)=\(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'