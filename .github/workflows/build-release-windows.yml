name: Build release Windows

# Tag-driven Windows release for the Reasonix Wails line.
#
# Scope: this fork ships Windows x64 only - the desktop app, its NSIS
# installer, and the CLI binary. Upstream's multi-platform matrix behind
# SignPath/Apple/R2 signing is not part of this line.
#
# Tag convention: vMAJOR.MINOR.PATCH, or the pre-release form vX.Y.Z-beta.N.
# The numbers are this line's own version, unrelated to the upstream 1.x line.
# Three numeric segments are required: the NSIS installer builds
# VIProductVersion from `${version}.0` (see
# desktop/build/windows/installer/project.nsi), so a four-segment tag such as
# v0.1.0.1 would produce an invalid five-segment version and fail the build.
# The -beta.M suffix is stripped before it reaches NSIS (scripts/desktop-build.sh
# does numver="${numver%%-*}"), so v0.1.0-beta.1 builds as the valid 0.1.0.
#
#   git tag v0.1.0 && git push origin v0.1.0
#   git tag v0.1.0-beta.1 && git push origin v0.1.0-beta.1
#
# Produces a GitHub Release with the portable archive and the NSIS installer.

on:
  push:
    tags:
      # Glob, not regex: GitHub tag filters do not support '+'. Keep this wide
      # and enforce the exact three-segment shape in the verify step below.
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v0.1.0)"
        required: true
        type: string
      anchor_only:
        description: "Recover wails-latest from an already-published version; do not rebuild or overwrite version assets."
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: build-release-windows-${{ github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Validate tag shape and the branch it sits on
        id: check
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]]; then
            echo "::error::tag must be vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-beta.N, got: $RELEASE_TAG" >&2
            echo "::error::four-segment tags (e.g. v1.38.2.1) break the NSIS installer build" >&2
            exit 1
          fi
          # Only a tag on this fork's own line may publish. The v[0-9]* glob
          # above also matches the other lines' tags, and a tag on a commit no
          # CI run here ever gated must never ship artifacts.
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$RELEASE_TAG is not on origin/main" >&2
            exit 1
          fi
          echo "version=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing $RELEASE_TAG"

      - name: Verify official main-push CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          DEADLINE=$((SECONDS + 5400))
          while true; do
            RUN="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SHA&per_page=100" \
              --jq '.workflow_runs[] | select(.name == "CI" and .event == "push" and .head_branch == "main") | "\(.status) \(.conclusion) \(.id)"' | head -1 || true)"
            if [ -n "$RUN" ]; then
              read -r STATUS CONCLUSION RUN_ID <<< "$RUN"
              echo "Official CI run $RUN_ID for $SHA: $STATUS/$CONCLUSION"
              if [ "$STATUS" = "completed" ]; then
                if [ "$CONCLUSION" = "success" ]; then
                  echo "The exact tag commit passed official main-push CI."
                  exit 0
                fi
                echo "::error::Official main-push CI failed for $SHA; refusing to publish."
                exit 1
              fi
            else
              echo "No official main-push CI run found for $SHA yet."
            fi
            if [ "$SECONDS" -ge "$DEADLINE" ]; then
              echo "::error::Timed out waiting for official main-push CI for $SHA."
              exit 1
            fi
            sleep 30
          done
  build:
    if: ${{ inputs.anchor_only != true }}
    needs: verify
    uses: ./.github/workflows/build-windows.yml
    with:
      version: ${{ needs.verify.outputs.version }}

  release:
    needs: [verify, build]
    if: ${{ always() && needs.verify.result == 'success' && (needs.build.result == 'success' || inputs.anchor_only == true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      # download-artifact reads the run's artifacts through the Actions API;
      # an explicit permissions block turns every unlisted scope off.
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download build artifacts
        if: ${{ inputs.anchor_only != true }}
        uses: actions/download-artifact@v8
        with:
          name: reasonix-windows-amd64-${{ needs.verify.outputs.version }}
          path: dist

      - name: List artifacts
        if: ${{ inputs.anchor_only != true }}
        run: ls -la dist

      - name: Upload Windows assets to draft release
        if: ${{ inputs.anchor_only != true }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          # Keep the version release private until binaries, signature,
          # manifest, and the version catalog are ready.
          exe_asset="Reasonix-windows-amd64.exe"
          installer_asset="Reasonix-windows-amd64-installer.exe"
          cli_asset="reasonix-cli-windows-amd64.exe"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            IS_DRAFT="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)"
            if [ "$IS_DRAFT" != "true" ]; then
              echo "::error::Release $RELEASE_TAG is already public. Refusing to replace published assets. To repair only the mutable update anchor, rerun this workflow with anchor_only=true."
              exit 1
            fi
            echo "Release $RELEASE_TAG already exists as a draft; replacing draft assets."
          else
            echo "Release $RELEASE_TAG absent; creating it as a draft."
            gh release create "$RELEASE_TAG" --draft \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi
          gh release upload "$RELEASE_TAG" "dist/${exe_asset}" "dist/${installer_asset}" "dist/${cli_asset}" --clobber
      - name: Sign and stage the update manifest
        if: ${{ inputs.anchor_only != true }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.version }}
          MINISIGN_PRIVATE_KEY: ${{ secrets.MINISIGN_PRIVATE_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -euo pipefail
          # The bare exe is the updater artifact, so the updater's required
          # filename and the manifest input are the same file — no second copy
          # is made. The installer is signed too but stays out of the manifest.
          rm -rf manifest-input
          mkdir -p manifest-input
          cp dist/Reasonix-windows-amd64.exe manifest-input/
          ( cd desktop && go run ./cmd/sign sign ../dist/Reasonix-windows-amd64.exe )
          ( cd desktop && go run ./cmd/sign manifest ../manifest-input "$RELEASE_TAG" "$RELEASE_TAG" )
          gh release upload "$RELEASE_TAG" \
            dist/Reasonix-windows-amd64.exe \
            dist/Reasonix-windows-amd64.exe.minisig \
            --clobber
          # The immutable version manifest lives on the version's own release.
          gh release upload "$RELEASE_TAG" manifest-input/latest.json --clobber
          # Create the mutable update anchor as a draft if this is the first release.
          if ! gh release view wails-latest >/dev/null 2>&1; then
            gh release create wails-latest --draft --latest=false \
              --title "Reasonix Wails update anchor" \
              --notes "Update-check anchor for the Reasonix Wails line. latest.json here is overwritten by every release of that line; versions.json lists the panel's versions."
          fi

      - name: Restore manifest from published release for anchor-only recovery
        if: ${{ inputs.anchor_only == true }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          IS_DRAFT="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)"
          if [ "$IS_DRAFT" != "false" ]; then
            echo "::error::anchor_only recovery requires an already-published version release."
            exit 1
          fi
          ASSETS="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          for asset in \
            Reasonix-windows-amd64.exe \
            Reasonix-windows-amd64-installer.exe \
            reasonix-cli-windows-amd64.exe \
            Reasonix-windows-amd64.exe.minisig \
            latest.json; do
            if ! grep -Fxq "$asset" <<< "$ASSETS"; then
              echo "::error::Published release $RELEASE_TAG is missing required asset: $asset"
              exit 1
            fi
          done
          mkdir -p manifest-input
          gh release download "$RELEASE_TAG" -p latest.json -D manifest-input
          # Recovery can also create the mutable anchor if its first publication failed.
          if ! gh release view wails-latest >/dev/null 2>&1; then
            gh release create wails-latest --draft --latest=false \
              --title "Reasonix Wails update anchor" \
              --notes "Update-check anchor for the Reasonix Wails line. latest.json here is overwritten by every release of that line; versions.json lists the panel's versions."
          fi

      - name: Update this line's version catalog
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          # The catalog lists which versions the update panel may offer. It is
          # rewritten on every release and always keeps the whole history;
          # catalogfilter decides what the panel actually shows.
          anchor=wails-latest
          catalog_keep=100000
          recent=5
          recent_stable=3
          # The channel decides whether the panel counts this entry toward the
          # stable quota, so it is derived from the tag's shape: vX.Y.Z is a
          # stable release, vX.Y.Z-beta.N is a pre-release.
          channel=stable
          case "$RELEASE_TAG" in *-beta.*) channel=beta ;; esac
          mkdir -p catalog
          existing=-
          if gh release view "$anchor" >/dev/null 2>&1; then
            ANCHOR_IS_DRAFT="$(gh release view "$anchor" --json isDraft --jq .isDraft)"
            if gh release download "$anchor" -p versions.json -D catalog --clobber 2>/dev/null; then
              existing=catalog/versions.json
            elif gh release download "$anchor" -p versions.json.backup -D catalog --clobber 2>/dev/null; then
              cp catalog/versions.json.backup catalog/versions.json
              existing=catalog/versions.json
              echo "::warning::Restored the previous catalog from versions.json.backup."
            elif [ "$ANCHOR_IS_DRAFT" = "true" ]; then
              echo "Draft anchor has no catalog or backup yet; starting a new one."
            else
              echo "::error::Published update anchor is missing versions.json and its backup; refusing to reset release history."
              exit 1
            fi
          else
            echo "No update anchor yet; starting a new one."
          fi
          # Preserve the current published catalog before preparing its replacement.
          # The backup is uploaded before versions.json is replaced, so a failed
          # --clobber upload can be recovered without losing release history.
          if [ "$existing" != "-" ]; then
            cp "$existing" catalog/versions.json.backup
          fi
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # The next release reads back what this one wrote, so the index keeps
          # every entry and only the filter trims: a small keep here would drop
          # history permanently.
          #
          # Written to a temp file first: the existing index is read from this
          # same path, and a plain redirect would truncate it before the script ran.
          bash scripts/update-versions-index.sh "$existing" "$RELEASE_TAG" "$RELEASE_TAG" "$channel" "$now" "$catalog_keep" \
            | go run ./tools/catalogfilter -recent "$recent" -recent-stable "$recent_stable" \
            > catalog/versions.json.new
          mv catalog/versions.json.new catalog/versions.json
          # Idempotency check: the version just published must be listed exactly
          # once, whatever the filter kept around it.
          jq -e --arg v "$RELEASE_TAG" '.versions | map(select(.version == $v)) | length == 1' catalog/versions.json >/dev/null
          # Keep the catalog local until the version release is public.
          jq -r '.versions[].version' catalog/versions.json

      - name: Publish completed release and update its anchor
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.version }}
          ANCHOR_ONLY: ${{ inputs.anchor_only }}
        run: |
          set -euo pipefail
          # A normal run publishes the prepared version. Anchor-only recovery
          # never edits the already-published immutable version release.
          if [ "${ANCHOR_ONLY:-false}" != "true" ]; then
            gh release edit "$RELEASE_TAG" --draft=false
          fi

          # The mutable anchor is intentionally never the repository Latest.
          # Back up the last known catalog before replacing it: GitHub's --clobber
          # deletes the old asset before uploading the replacement.
          if [ -f catalog/versions.json.backup ]; then
            gh release upload wails-latest catalog/versions.json.backup --clobber
          fi
          gh release upload wails-latest manifest-input/latest.json --clobber
          gh release upload wails-latest catalog/versions.json --clobber
          gh release edit wails-latest --draft=false --latest=false
      - name: Summarize release
        env:
          RELEASE_TAG: ${{ needs.verify.outputs.version }}
        run: |
          {
            echo "### Windows release $RELEASE_TAG"
            echo ""
            echo "| Asset | Size |"
            echo "|---|---|"
            for f in dist/*; do
              echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
