name: PR metadata

# Validate PR declarations in a separate workflow so body edits never cancel
# the expensive CI workflow. Only trusted scripts from the base commit run here.

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-metadata-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-metadata:
    name: pr-metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted base-branch scripts
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Collect PR changed files
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh api --paginate "repos/${REPOSITORY}/pulls/${PR_NUMBER}/files" \
            --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/changed-files.txt"

      - name: Check documentation impact declaration
        env:
          PR_BODY: ${{ github.event.pull_request.body || '' }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          DOCS_IMPACT_CHANGED_FILES_FILE: ${{ runner.temp }}/changed-files.txt
        run: bash scripts/check-docs-impact.sh

      - name: Check cache impact declaration
        env:
          PR_BODY: ${{ github.event.pull_request.body || '' }}
          CACHE_IMPACT_CHANGED_FILES_FILE: ${{ runner.temp }}/changed-files.txt
        run: bash scripts/check-cache-impact.sh

      - name: Check Blast Radius declaration
        env:
          PR_BODY: ${{ github.event.pull_request.body || '' }}
        run: bash scripts/check-blast-radius.sh
