name: CI (docs)

# Documentation-only pull requests. The path list here and the paths-ignore
# list in ci-code.yml must stay exact mirrors of each other: a file must land
# in exactly one entry point, otherwise a PR starts both and produces two
# `gate` checks.

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "plan/**"
      - "plan/**"
      - ".agents/**"
      - "release-notes/**"
      - "benchmarks/**"
      - "tmp/**"
      - "*.md"
      - "LICENSE"
      - ".gitignore"
      - ".gitattributes"
      - ".editorconfig"
      - ".coderabbit.yaml"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
      - ".github/labeler.yml"
      - ".github/dependabot.yml"

permissions:
  contents: read

concurrency:
  group: ci-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    uses: ./.github/workflows/check-changes.yml

  docs-rules:
    uses: ./.github/workflows/check-docs-rules.yml

  gate:
    needs: [changes, docs-rules]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify every job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key)=\(.value.result)"'
          # No skipped lane is allowed: a skipped check cannot be told apart
          # from a failure when reading the PR's check list.
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'